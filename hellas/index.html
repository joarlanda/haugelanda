<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:,">
<title>Hellas – logg inn</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1b2a33;--muted:#566670;--line:#d9dcd6;--accent:#1d5c86;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a20;--card:#17252d;--ink:#e8ecea;--muted:#9db0b8;--line:#2b3b43;--accent:#6fb4e0;--err:#f2a29c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
h1{margin:0 0 4px;font-size:22px}
p{margin:0 0 16px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;padding:9px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rm{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:13px}
button{width:100%;margin-top:16px;padding:10px;font:600 15px system-ui,sans-serif;color:#fff;background:var(--accent);border:0;border-radius:5px;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0f1a20}}
#err{min-height:1.4em;margin-top:10px;color:var(--err);font-size:13px}
a{color:var(--accent);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Hellas</h1>
  <p>Logg inn for å se reiseplanen.</p>
  <form id="f" autocomplete="on">
    <label for="u">Brukernavn</label>
    <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" required>
    <label for="p">Passord</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="rm"><input id="r" type="checkbox" checked><label for="r" style="margin:0">Hold meg innlogget i 30 dager</label></div>
    <button type="submit">Logg inn</button>
    <div id="err" role="alert"></div>
  </form>
  <a href="/">Til forsiden</a>
  <noscript><p>Siden trenger JavaScript for å åpne.</p></noscript>
</main>

  if(USERS.indexOf(u)<0){err.textContent='Feil brukernavn eller passord.';return}
  crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
   .then(function(b){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(P.s),iterations:P.n,hash:'SHA-256'},b,{name:'AES-GCM',length:256},true,['decrypt'])})
   .then(function(key){return dec(key).then(function(html){return crypto.subtle.exportKey('raw',key).then(function(raw){setck('hellas_k',u2b(new Uint8Array(raw)),days);setck('hellas_u',u,days);show(html)})})})
   .catch(function(){err.textContent='Feil brukernavn eller passord.'});
 });
}
})();
</script>
