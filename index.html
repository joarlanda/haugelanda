<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>Haugelanda</title>
<style>
:root{--bg:#f6f5f1;--ink:#1b2a33;--muted:#566670;--line:#d9dcd6;--card:#fff;--accent:#1d5c86}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a20;--ink:#e8ecea;--muted:#9db0b8;--line:#2b3b43;--card:#17252d;--accent:#6fb4e0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:48px max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto}
h1{font-size:34px;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 28px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a.item{display:block;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none}
a.item:hover,a.item:focus-visible{border-color:var(--accent);outline:none}
a.item b{display:block;font-size:18px}
a.item span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Haugelanda</h1>
  <p>Velg en side.</p>
  <ul>
    <li><a class="item" href="/hellas/"><b>Hellas</b><span>Reiseplan, krever innlogging</span></a></li>
  </ul>
</main>
</body>
</html>
